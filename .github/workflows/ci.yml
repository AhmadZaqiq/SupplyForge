name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build

      - name: Start SQL Server container
        run: >
          docker run
          -e "ACCEPT_EULA=Y"
          -e "MSSQL_SA_PASSWORD=SupplyForge_Dev_2026!"
          -p 1433:1433
          --name supplyforge-sql
          -d mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec supplyforge-sql /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P 'SupplyForge_Dev_2026!' -C -Q 'SELECT 1' \
                > /dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/30)"
            sleep 5
          done
          echo "SQL Server did not become ready" >&2
          exit 1

      - name: Run unit tests (Inventory)
        run: dotnet test tests/Inventory.UnitTests/

      - name: Run unit tests (PlatformCore)
        run: dotnet test tests/PlatformCore.UnitTests/

      - name: Run architecture tests
        run: dotnet test tests/ArchitectureTests/

      - name: Run integration tests
        run: dotnet test tests/Inventory.IntegrationTests/

      - name: Stop and remove SQL Server container
        if: always()
        run: |
          docker stop supplyforge-sql > /dev/null 2>&1 || true
          docker rm supplyforge-sql > /dev/null 2>&1 || true
